<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1238" />
    <title>Happy Birthday, Abhi</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=Nunito:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="confetti" aria-hidden="true"></canvas>

    <div class="sky" aria-hidden="true">
      <span class="balloon balloon-a"></span>
      <span class="balloon balloon-b"></span>
      <span class="balloon balloon-c"></span>
      <span class="balloon balloon-d"></span>
      <span class="balloon balloon-e"></span>
    </div>

    <main>
      <p class="eyebrow">for my brother</p>
      <h1>Abhi</h1>
      <p class="subtitle">Happy Birthday</p>

      <div class="stage">
        <div class="cake" id="cake">
          <div class="candles" id="candles">
            <span class="candle"><i class="flame"></i></span>
            <span class="candle"><i class="flame"></i></span>
            <span class="candle tall"><i class="flame"></i></span>
            <span class="candle"><i class="flame"></i></span>
            <span class="candle"><i class="flame"></i></span>
          </div>
          <div class="frosting"></div>
          <div class="layer layer-top"></div>
          <div class="layer layer-mid"></div>
          <div class="layer layer-base"></div>
          <div class="plate"></div>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="wish">Blow out the candles</button>
        <button type="button" class="btn ghost" id="play">Play</button>
      </div>

      <audio
        id="song"
        src="happy-happy-birthday-i-wish-you-a-very-very-happy-birthday_XYzgC4vg.mp3"
        preload="auto"
      ></audio>

      <p class="wish-line" id="wish-line" hidden>Wish made. This year is yours.</p>

      <section class="note">
        <p>
          Another year of you, and I’m glad I get to be in it. Hope today is loud, sweet,
          and exactly the way you want it.
        </p>
        <p class="signoff">Happy birthday, Abhi.</p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
